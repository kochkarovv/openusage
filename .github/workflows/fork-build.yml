name: Fork Build

# Fork: builds an unsigned (ad-hoc) OpenUsage.app and attaches it to a GitHub release.
on:
  push:
    branches: [main, swift-sync]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-26-intel when arm64 capacity is exhausted)
        default: macos-26

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version && uname -m

      - name: Test
        run: swift test

      - name: Build app
        # Always Apple Silicon, even when an Intel runner had to be used.
        run: CODESIGN_IDENTITY= SWIFT_BUILD_ARCH=arm64 script/build_and_run.sh build

      - name: Verify architecture
        run: lipo -archs dist/OpenUsage.app/Contents/MacOS/OpenUsage | grep -qx arm64

      - name: Package
        run: ditto -c -k --keepParent dist/OpenUsage.app OpenUsage.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUsage
          path: OpenUsage.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fork-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" OpenUsage.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fork build $TAG" --notes "Ad-hoc signed build of $GITHUB_SHA." --prerelease
